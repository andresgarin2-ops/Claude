name: Check SISFE Expedientes

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('sisfe-bot/requirements.txt') }}

      - name: Install Python dependencies
        working-directory: sisfe-bot
        run: pip install -r requirements.txt

      - name: Install Playwright (Chromium) with system dependencies
        run: python -m playwright install --with-deps chromium

      - name: Diagnóstico de conectividad SISFE
        run: |
          echo "=== IP pública del runner ==="
          curl -s https://api.ipify.org
          echo ""
          echo "=== HTTP status de SISFE ==="
          curl -o /dev/null -s -w "HTTP %{http_code} | tiempo: %{time_total}s\n" \
            --max-time 30 \
            --user-agent "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36" \
            https://sisfe.justiciasantafe.gov.ar || echo "FALLO: sin respuesta (timeout o bloqueo)"
          echo "=== Headers de respuesta ==="
          curl -s -I --max-time 30 \
            --user-agent "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36" \
            https://sisfe.justiciasantafe.gov.ar 2>&1 | head -20 || echo "Sin headers"
        continue-on-error: true

      - name: Run SISFE bot
        working-directory: sisfe-bot
        env:
          SISFE_MATRICULA: ${{ secrets.SISFE_MATRICULA }}
          SISFE_PASSWORD: ${{ secrets.SISFE_PASSWORD }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
        run: python main.py

      - name: Commit updated state.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sisfe-bot/state.json
          git diff --staged --quiet || git commit -m "chore: update SISFE state [skip ci]"
          git push
