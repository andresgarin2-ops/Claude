name: Check SISFE Expedientes

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('sisfe-bot/requirements.txt') }}

      - name: Install Python dependencies
        working-directory: sisfe-bot
        run: pip install -r requirements.txt

      - name: Install Chromium system dependencies
        run: |
          sudo apt-get install -y \
            libasound2t64 \
            libatk-bridge2.0-0 \
            libatk1.0-0 \
            libcups2 \
            libdbus-1-3 \
            libdrm2 \
            libgbm1 \
            libgtk-3-0 \
            libnss3 \
            libxkbcommon0 \
            libxss1

      - name: Install Playwright (Chromium)
        run: python -m playwright install chromium

      - name: Run SISFE bot
        working-directory: sisfe-bot
        env:
          SISFE_MATRICULA: ${{ secrets.SISFE_MATRICULA }}
          SISFE_PASSWORD: ${{ secrets.SISFE_PASSWORD }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
        run: python main.py

      - name: Commit updated state.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sisfe-bot/state.json
          git diff --staged --quiet || git commit -m "chore: update SISFE state [skip ci]"
          git push
