# ============================================================
# Configuración del bot SISFE
# ============================================================
# Las credenciales (usuario, contraseña, tokens) se cargan desde
# variables de entorno / GitHub Secrets. NO las pongas aquí.

sisfe:
  login_url: "https://sisfe.justiciasantafe.gov.ar"
  search_url: "https://sisfe.justiciasantafe.gov.ar/buscar-expediente"
  # Campos del formulario de Matriculados:
  circunscripcion: "Rosario"    # valor del dropdown (no es secreto)
  colegio: "Abogados"           # valor del dropdown (no es secreto)
  # matricula → env: SISFE_MATRICULA
  # password  → env: SISFE_PASSWORD

# Lista de expedientes a monitorear
# Formato: JUR-NUMERO-SUFIJO (ej: "21-02343434-2")
expedientes:
  - codigo: "21-25448313-0"
    descripcion: "Censi c/ Gomez s/ ejecutivo"
  # Agregá más expedientes acá:
  # - codigo: "21-XXXXXXXX-X"
  #   descripcion: "Mi expediente"

twilio:
  from_number: "whatsapp:+14155238886"
  to_number: "whatsapp:+5493415154942"
  # account_sid → env: TWILIO_ACCOUNT_SID
  # auth_token  → env: TWILIO_AUTH_TOKEN

# Archivo JSON donde se persiste el estado (se commitea al repo)
state_file: "state.json"
